[project]
name = "ai-job-agent-platform"
version = "1.0.0"
description = "AI求职智能管家 - 企业级AI多智能体求职辅助工具"
requires-python = ">=3.11"
readme = "docs/产品需求文档（PRD）V1.0.md"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
