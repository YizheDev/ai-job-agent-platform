###############################################################
# AI求职智能管家 - Docker Compose 一键部署
# 用法: docker compose up -d
###############################################################

services:
  # ===== 应用服务 =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-job-agent
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - DOCKER_CONTAINER=1
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - ./.env:/app/.env
    networks:
      - agent-net
    # Chromium 需要共享内存，默认 64MB 不够
    shm_size: "1gb"
    mem_limit: 4g
    cpus: 2.0

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: ai-job-agent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - agent-net

volumes:
  app-data:
    driver: local
  app-logs:
    driver: local

networks:
  agent-net:
    driver: bridge
